// ============================================================
// analysis.html 의 <script> 안, redraw() 함수를 아래로 교체
// (그 위의 SPEC_CONFIG 도 같이 추가)
// ============================================================

// ── 스펙 라인 설정 ──────────────────────────────────────
// ★ 나중에 실제 Upper/Lower/Target 값을 서버에서 받으면
//    getSpecLines() 안만 고치면 됨. (아래 주석 참고)
function getSpecLines(data, param) {
  // ─────────────────────────────────────────────
  // [나중에 실서버 연동 시]
  //   서버가 내려준 스펙값을 그대로 반환하면 됨:
  //   return {
  //     upper:  specFromServer.upper,
  //     lower:  specFromServer.lower,
  //     target: specFromServer.target,
  //   };
  // ─────────────────────────────────────────────

  // [지금은 임시] 데이터의 max / min / 평균으로 대체
  const vals = data.map(d => d.val).filter(v => v !== null && !isNaN(v));
  if (!vals.length) return null;

  const upper  = Math.max(...vals);
  const lower  = Math.min(...vals);
  const target = vals.reduce((a, b) => a + b, 0) / vals.length;

  return { upper, lower, target };
}

// 스펙 라인 스타일 (여기서 색/두께 조절)
const SPEC_STYLE = {
  upper:  { color: '#ef4444', dash: 'dash', width: 1.4, label: 'Upper' },
  lower:  { color: '#ef4444', dash: 'dash', width: 1.4, label: 'Lower' },
  target: { color: '#22c55e', dash: 'dot',  width: 1.4, label: 'Target' },
};


// ── 차트 그리기 ─────────────────────────────────────────
function redraw() {
  if (!currentData.length) return;
  const legendCol = selLegend.value;

  // 범례값별 그룹핑
  const groups = {};
  currentData.forEach(d => {
    const key = (d[legendCol] === null || d[legendCol] === '') ? '(없음)' : d[legendCol];
    if (!groups[key]) groups[key] = { x: [], y: [], ids: [], text: [] };
    groups[key].x.push(d.date);
    groups[key].y.push(d.val);
    groups[key].ids.push(d.id);
    groups[key].text.push(`${d.LOT_ID} / WF${d.WF_ID}<br>${legendCol}: ${key}`);
  });

  const traces = Object.entries(groups).map(([name, g]) => ({
    x: g.x, y: g.y,
    customdata: g.ids,
    text: g.text,
    name: String(name),
    mode: 'markers',
    type: 'scattergl',
    marker: {
      size: 9,
      opacity: 0.8,
      line: { width: 0.5, color: 'rgba(0,0,0,0.35)' },
    },
    hovertemplate: '%{text}<br><b>%{y:.2f}</b><extra></extra>',
  }));

  // 차트 제목 = 검색 조건 조합
  const operText = selOper.options[selOper.selectedIndex].text;
  const chartTitle = `${selTech.value} · ${selLot.value} · ${operText} · ${currentParam}`;

  // ── 스펙 라인 (Upper / Lower / Target) ──────────────
  const spec = getSpecLines(currentData, currentParam);
  const shapes = [];
  const annotations = [];

  if (spec) {
    ['upper', 'target', 'lower'].forEach(k => {
      const v = spec[k];
      if (v === null || v === undefined || isNaN(v)) return;
      const st = SPEC_STYLE[k];
      shapes.push({
        type: 'line', xref: 'paper', yref: 'y',
        x0: 0, x1: 1, y0: v, y1: v,
        line: { color: st.color, width: st.width, dash: st.dash },
        layer: 'below',
      });
      annotations.push({
        xref: 'paper', yref: 'y',
        x: 1, xanchor: 'right',
        y: v, yanchor: 'bottom',
        text: `${st.label} ${v.toFixed(2)}`,
        showarrow: false,
        font: { size: 10, color: st.color, family: 'Noto Sans KR, sans-serif' },
        bgcolor: 'rgba(17,17,17,0.7)',
        borderpad: 2,
      });
    });
  }

  const layout = {
    title: {
      text: chartTitle,
      font: { family: 'Noto Sans KR, sans-serif', size: 15, color: '#ffffff' },  // 선명하게
      x: 0.5, xanchor: 'center',
      y: 0.97, yanchor: 'top',
    },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor:  'rgba(0,0,0,0)',
    font: { family: 'Noto Sans KR, sans-serif', color: '#8c8c8c', size: 12 },
    margin: { l: 65, r: 25, t: 58, b: 65 },

    xaxis: {
      title: { text: 'DATE', font: { size: 12, color: '#8c8c8c' } },
      showgrid: true,
      gridcolor: 'rgba(255,255,255,0.10)',   // 옅은 회색
      griddash: 'dot',                        // 점선
      gridwidth: 1,
      zeroline: false,
      linecolor: 'rgba(255,255,255,0.18)',
      tickfont: { size: 11 },
    },
    yaxis: {
      title: { text: currentParam, font: { size: 12, color: '#8c8c8c' } },
      showgrid: true,
      gridcolor: 'rgba(255,255,255,0.10)',
      griddash: 'dot',
      gridwidth: 1,
      zeroline: false,
      linecolor: 'rgba(255,255,255,0.18)',
      tickfont: { size: 11 },
    },

    shapes: shapes,
    annotations: annotations,

    dragmode: 'select',
    selectdirection: 'any',
    // 선택 안 된 점을 흐리게 (드래그 시 대비)
    scattermode: 'overlay',

    legend: {
      orientation: 'h',
      x: 0.5, xanchor: 'center',
      y: -0.20, yanchor: 'top',
      font: { size: 11 },
      bgcolor: 'rgba(0,0,0,0)',
    },
    hovermode: 'closest',
    hoverlabel: {
      bgcolor: '#1e1e1e',
      bordercolor: '#3a3a3a',
      font: { family: 'Noto Sans KR, sans-serif', size: 11, color: '#ececec' },
    },
  };

  const plotDiv = document.getElementById('js-plot');

  Plotly.newPlot(plotDiv, traces, layout, {
    responsive: true,
    modeBarButtonsToRemove: ['lasso2d', 'autoScale2d'],
    displaylogo: false,
  });

  // ── 드래그 이벤트 ────────────────────────────────────
  // 새 드래그 → 이전 선택 자동 해제 후 새로 선택 (Plotly 기본 동작)
  plotDiv.on('plotly_selected', (ev) => {
    if (!ev || !ev.points || !ev.points.length) return;
    const ids = ev.points.map(p => p.customdata);
    onSelected(ids);   // Step3에서 통계 호출
  });

  // 빈 곳 클릭 → 선택 해제
  plotDiv.on('plotly_deselect', () => {
    clearSelection();
  });

  // 더블클릭으로도 해제
  plotDiv.on('plotly_doubleclick', () => {
    Plotly.restyle(plotDiv, { selectedpoints: [null] });
    clearSelection();
  });
}

// ── 선택/해제 처리 (Step3 통계와 연결) ──────────────────
function onSelected(ids) {
  // Step3에서 여기서 통계 API 호출
  console.log('선택된 점:', ids.length);
}

function clearSelection() {
  const plotDiv = document.getElementById('js-plot');
  Plotly.restyle(plotDiv, { selectedpoints: [null] });
  // Step3의 통계 패널 숨기기
  const card = document.getElementById('js-stats-card');
  if (card) card.style.display = 'none';
}
