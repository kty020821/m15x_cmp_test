{% extends 'base.html' %}
{% block title %}산포 분석{% endblock %}

{% block extra_css %}
<style>
.an-page { padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 18px; }
.an-title { font-size: 16px; font-weight: 700; color: var(--tx-1); }
.an-sub { font-size: 12px; color: var(--tx-2); margin-top: 3px; }

.filter-panel { background: var(--bg-3); border: 1px solid var(--bd); border-radius: var(--r);
  padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 160px; }
.filter-label { font-size: 11px; font-weight: 600; color: var(--tx-muted);
  text-transform: uppercase; letter-spacing: .05em; }
.filter-select { padding: 7px 10px; background: var(--bg-2); border: 1px solid var(--bd);
  border-radius: var(--rs); color: var(--tx-1); font-size: 13px; outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--accent); }
.filter-select:disabled { opacity: .4; cursor: not-allowed; }

.btn-run { padding: 8px 24px; background: var(--accent); border: none; border-radius: var(--rs);
  color: #000; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-run:hover { opacity: .85; }
.btn-run:disabled { opacity: .4; cursor: not-allowed; }

.debug-box { background: var(--bg-3); border: 1px solid var(--bd); border-radius: var(--r);
  padding: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--tx-2); }
.debug-box strong { color: var(--accent); }
</style>
{% endblock %}

{% block content %}
<div class="an-page">
  <div>
    <h1 class="an-title">산포 분석</h1>
    <p class="an-sub">공정 파라미터 트렌드 및 산포 요인 분석</p>
  </div>

  <!-- 종속 드롭박스 -->
  <div class="filter-panel">
    <div class="filter-group">
      <span class="filter-label">TECH</span>
      <select class="filter-select" id="sel-tech">
        <option value="">선택</option>
        {% for t in tech_list %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">LOT_CD</span>
      <select class="filter-select" id="sel-lot" disabled><option value="">-</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">OPER</span>
      <select class="filter-select" id="sel-oper" disabled><option value="">-</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">PARAMETER</span>
      <select class="filter-select" id="sel-param" disabled><option value="">-</option></select>
    </div>
    <button class="btn-run" id="btn-run" disabled onclick="showSelection()">조회</button>
  </div>

  <!-- Step1 확인용: 선택값 표시 (Step2에서 차트로 교체) -->
  <div class="debug-box" id="js-debug">
    드롭박스가 순서대로 채워지는지 확인하세요.<br>
    API_BASE: <strong id="js-apibase"></strong>
  </div>
</div>

<script>
// ★ proxy 경로 자동 처리 (회사 서버: /proxy/8000/... 대응)
//    Django {% url %} 가 실제 경로를 만들어주므로 로컬/서버 모두 동작
const API_OPTIONS = "{% url 'analysis-options' %}";
document.getElementById('js-apibase').textContent = API_OPTIONS;

const selTech  = document.getElementById('sel-tech');
const selLot   = document.getElementById('sel-lot');
const selOper  = document.getElementById('sel-oper');
const selParam = document.getElementById('sel-param');
const btnRun   = document.getElementById('btn-run');

async function postJSON(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    console.error('API 오류', res.status, url);
    alert(`API 오류 ${res.status}\n${url}`);
    return {options: []};
  }
  return res.json();
}

function fillSelect(sel, options) {
  sel.innerHTML = '<option value="">선택</option>';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  });
}

function resetFrom(level) {
  const order = ['lot', 'oper', 'param'];
  const map = {lot: selLot, oper: selOper, param: selParam};
  let hit = false;
  order.forEach(l => {
    if (l === level) hit = true;
    if (hit) {
      map[l].innerHTML = '<option value="">-</option>';
      map[l].disabled = true;
    }
  });
  btnRun.disabled = true;
}

// TECH → LOT_CD
selTech.addEventListener('change', async () => {
  resetFrom('lot');
  if (!selTech.value) return;
  const {options} = await postJSON(API_OPTIONS, {level: 'lot_cd', tech: selTech.value});
  fillSelect(selLot, options.map(o => ({value: o, label: o})));
  selLot.disabled = false;
});

// LOT_CD → OPER
selLot.addEventListener('change', async () => {
  resetFrom('oper');
  if (!selLot.value) return;
  const {options} = await postJSON(API_OPTIONS, {level: 'oper'});
  fillSelect(selOper, options);
  selOper.disabled = false;
});

// OPER → PARAMETER
selOper.addEventListener('change', async () => {
  resetFrom('param');
  if (!selOper.value) return;
  const {options, error} = await postJSON(API_OPTIONS, {level: 'param', oper_id: selOper.value});
  if (error) { alert('파라미터 조회 오류: ' + error); return; }
  fillSelect(selParam, options.map(o => ({value: o, label: o})));
  selParam.disabled = false;
});

selParam.addEventListener('change', () => {
  btnRun.disabled = !selParam.value;
});

// Step1: 선택값만 확인 (Step2에서 차트로 교체)
function showSelection() {
  document.getElementById('js-debug').innerHTML = `
    <strong>선택 완료</strong><br>
    TECH: ${selTech.value}<br>
    LOT_CD: ${selLot.value}<br>
    OPER: ${selOper.value}<br>
    PARAM: ${selParam.value}<br><br>
    → 여기까지 되면 Step2(차트)로 넘어갑니다.
  `;
}
</script>
{% endblock %}
