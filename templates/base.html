{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}M15X CMP{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
    :root {
      --sidebar-w: 240px;
      --bg-0: #0a0a0a; --bg-1: #111111; --bg-2: #171717; --bg-3: #1e1e1e;
      --bg-hover: #242424; --bg-active: #2a2a2a;
      --bd: #2a2a2a; --bd-soft: #1e1e1e;
      --tx-1: #ececec; --tx-2: #8c8c8c; --tx-muted: #4a4a4a;
      --accent: #cc8b3c;
      --up: #22c55e; --up-bg: rgba(34,197,94,.10); --up-bd: rgba(34,197,94,.22);
      --dn: #ef4444; --dn-bg: rgba(239,68,68,.10); --dn-bd: rgba(239,68,68,.22);
      --r: 8px; --rs: 5px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Noto Sans KR', -apple-system, sans-serif; font-size: 14px; background: var(--bg-2); color: var(--tx-1); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100%; background: var(--bg-1); border-right: 1px solid var(--bd); display: flex; flex-direction: column; overflow: hidden; transition: width .22s ease, min-width .22s ease; flex-shrink: 0; }
    .sidebar.collapsed { width: 0; min-width: 0; border-right: none; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px; white-space: nowrap; overflow: hidden; }
    .brand-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-icon svg { width: 14px; height: 14px; }
    .brand-text { display: flex; flex-direction: column; overflow: hidden; }
    .brand-name { font-size: 13px; font-weight: 700; color: var(--tx-1); white-space: nowrap; }
    .brand-sub  { font-size: 10px; color: var(--tx-muted); margin-top: 1px; white-space: nowrap; }
    .sidebar-divider { height: 1px; background: var(--bd); flex-shrink: 0; }
    .sidebar-nav { flex: 1; padding: 10px 8px; padding-top: 50px; overflow-y: auto; overflow-x: hidden; }
    .nav-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--tx-muted); padding: 6px 8px 4px; white-space: nowrap; }
    .nav-link { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--rs); color: var(--tx-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s, color .12s; white-space: nowrap; overflow: hidden; }
    .nav-link:hover  { background: var(--bg-hover); color: var(--tx-1); }
    .nav-link.active { background: var(--bg-active); color: var(--tx-1); }
    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--tx-muted); transition: color .12s; }
    .nav-link:hover .nav-icon, .nav-link.active .nav-icon { color: var(--accent); }
    .nav-label { overflow: hidden; text-overflow: ellipsis; }
    .sidebar-bottom { padding: 10px 14px; border-top: 1px solid var(--bd); font-size: 11px; color: var(--tx-muted); white-space: nowrap; overflow: hidden; }
    .main { flex: 1; min-width: 0; height: 100%; overflow-y: auto; background: var(--bg-2); }
    .home { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 40px; }
    .home-inner { text-align: center; max-width: 400px; }
    .home-logo-wrap { width: 52px; height: 52px; background: var(--accent); border-radius: 13px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .home-logo-wrap svg { width: 24px; height: 24px; }
    .home-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .home-desc  { font-size: 13px; color: var(--tx-2); line-height: 1.6; margin-bottom: 28px; }
    .home-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 20px; background: var(--accent); color: #000; font-size: 13px; font-weight: 600; border-radius: var(--rs); transition: opacity .15s; }
    .home-btn:hover { opacity: .85; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="js-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="1" y="1" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/>
            <rect x="12" y="1" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/>
            <rect x="1" y="12" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/>
            <rect x="12" y="12" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">M15X CMP</span>
          <span class="brand-sub">관리 시스템</span>
        </div>
        <button id="js-toggle" title="메뉴 접기/펼치기" style="margin-left:auto;flex-shrink:0;width:26px;height:26px;background:transparent;border:1px solid var(--bd);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx-2);transition:background .12s,color .12s;">
          <svg viewBox="0 0 14 14" fill="none" width="13" height="13"><path d="M1 3h12M1 7h12M1 11h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <p class="nav-section">메뉴</p>
        <ul>
          <li>
            <a href="{% url 'equipment' %}" class="nav-link {% if request.resolver_match.url_name == 'equipment' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
              <span class="nav-label">장비 현황</span>
            </a>
          </li>
          <li>
            <a href="{% url 'wip' %}" class="nav-link {% if request.resolver_match.url_name == 'wip' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><path d="M2 14h14M2 10h10M2 6h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span class="nav-label">WIP</span>
            </a>
          </li>
          <li>
            <a href="{% url 'rtd' %}" class="nav-link {% if request.resolver_match.url_name == 'rtd' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span class="nav-label">RTD 현황</span>
            </a>
          </li>
          <li>
            <a href="{% url 'llm' %}" class="nav-link {% if request.resolver_match.url_name == 'llm' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><path d="M2 5h14M2 9h10M2 13h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span class="nav-label">CMP LLM</span>
            </a>
          </li>
          <li>
            <a href="{% url 'capa' %}" class="nav-link {% if request.resolver_match.url_name == 'capa' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><path d="M2 16V8M6 16V4M10 16V6M14 16V2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span class="nav-label">Capa</span>
            </a>
          </li>
          <li>
            <a href="{% url 'capa-settings' %}" class="nav-link {% if request.resolver_match.url_name == 'capa-settings' %}active{% endif %}">
              <svg class="nav-icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.5 3.5l1.5 1.5M13 13l1.5 1.5M3.5 14.5l1.5-1.5M13 5l1.5-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span class="nav-label">Capa 설정</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">v1.0.0</div>
    </aside>
    <button id="js-toggle-collapsed" title="메뉴 펼치기" style="display:none;position:fixed;top:14px;left:14px;z-index:200;width:28px;height:28px;background:var(--bg-3);border:1px solid var(--bd);border-radius:var(--rs);align-items:center;justify-content:center;cursor:pointer;color:var(--tx-2);transition:background .12s,color .12s;">
      <svg viewBox="0 0 14 14" fill="none" width="13" height="13"><path d="M1 3h12M1 7h12M1 11h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <main class="main">{% block content %}{% endblock %}</main>
  </div>
  <script>
    const toggle = document.getElementById('js-toggle');
    const toggleCollapsed = document.getElementById('js-toggle-collapsed');
    const sidebar = document.getElementById('js-sidebar');
    const app = document.getElementById('app');
    toggle.addEventListener('click', () => { sidebar.classList.add('collapsed'); app.classList.add('sidebar-collapsed'); toggleCollapsed.style.display = 'flex'; });
    toggleCollapsed.addEventListener('click', () => { sidebar.classList.remove('collapsed'); app.classList.remove('sidebar-collapsed'); toggleCollapsed.style.display = 'none'; });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
